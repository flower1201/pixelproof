<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PixelProof Basic UI — Expected</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #14212b;
    }
    header {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      background: #0f766e;
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    main {
      max-width: 720px;
      margin: 32px auto;
      padding: 0 24px;
    }
    .card {
      background: #fff;
      border: 1px solid #d7dee7;
      border-radius: 12px;
      padding: 24px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }
    p {
      margin: 0 0 20px;
      line-height: 1.5;
      color: #3b4a58;
    }
    .cta {
      display: inline-block;
      background: #0f766e;
      color: #fff;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>PixelProof Demo</header>
  <main>
    <section class="card">
      <h1>Visual feedback for UI</h1>
      <p>This is the expected layout: teal header, white card, and a teal CTA button.</p>
      <a class="cta" href="#">Get started</a>
    </section>
  </main>
</body>
</html>
