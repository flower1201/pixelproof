name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Unit and non-browser tests
        run: npx vitest run tests/cli tests/core tests/report tests/e2e/cli.test.ts tests/capture/url.test.ts

  e2e-chromium:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Chromium capture and browser E2E
        run: npx vitest run tests/capture/chromium.test.ts tests/e2e/cli-url.test.ts tests/e2e/file-report.test.ts

  pack:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - name: Verify packed CLI image compare
        run: |
          mkdir -p /tmp/pp-pack
          tar -xzf pixelproof-cli-*.tgz -C /tmp/pp-pack
          cd /tmp/pp-pack/package
          npm install --omit=dev
          node ./dist/cli/index.js --help
          node ./dist/cli/index.js --version
          mkdir -p fixtures
          cp "$GITHUB_WORKSPACE/tests/fixtures/same-a.png" fixtures/
          cp "$GITHUB_WORKSPACE/tests/fixtures/same-b.png" fixtures/
          node ./dist/cli/index.js compare --target ./fixtures/same-a.png --actual ./fixtures/same-b.png --out ./report
          test -f ./report/result.json
          test -f ./report/index.html
